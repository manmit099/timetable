<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>FY CSAIML-C · Timetable</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    :root {
        --bg: #0e0f12;
        --surface: #16181d;
        --surface-2: #1c1f26;
        --surface-3: #22252e;
        --border: #23262d;
        --border-2: #2e323c;
        --border-3: #3a3f4c;

        --text: #e8eaee;
        --text-2: #b4b8c2;
        --muted: #72767f;
        --muted-2: #565a63;

        --accent: #8b93c4;
        --accent-soft: #262a3d;
        --accent-border: #3a4058;
        --accent-text: #c5cbe8;

        --ok: #7fae8f;
        --ok-soft: #1c2a22;
        --ok-border: #35493c;

        --theory: #8ba3c7;
        --lab: #c7a77c;
        --tut: #86b39a;

        --radius: 16px;

        --font-display: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --font-serif: "Fraunces", "Playfair Display", Georgia, "Times New Roman", serif;
    }

    html { scroll-behavior: smooth; }

    body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        padding: 0 1rem calc(3.5rem + env(safe-area-inset-bottom));
        padding-top: env(safe-area-inset-top);
        max-width: 760px;
        margin: 0 auto;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        font-feature-settings: "cv11", "ss01";
    }

    /* ============ HEADER ============ */
    .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .85rem;
        padding: 1.4rem 0 1.15rem;
    }
    .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; }

    .logo {
        width: 42px; height: 42px; flex: none;
        border-radius: 13px;
        display: grid; place-items: center;
        font-size: 1rem;
        color: var(--accent-text);
        background: var(--surface-2);
        border: 1px solid var(--border-2);
    }

    .brand-text { min-width: 0; }
    .brand-text h1 {
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -.02em;
        color: var(--text);
        line-height: 1.2;
        white-space: nowrap;
    }
    .brand-text p {
        font-family: var(--font-body);
        font-size: .72rem;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: .01em;
        margin-top: 1px;
    }

    .header-tools {
        display: flex;
        align-items: center;
        gap: .45rem;
        flex: none;
    }

    .batch-chip {
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        font-family: var(--font-mono);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--accent-text);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        padding: .42rem .65rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background .2s ease, border-color .2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .batch-chip i { font-size: .68rem; opacity: .8; }
    .batch-chip:active { transform: scale(.97); }
    @media (hover: hover) {
        .batch-chip:hover { background: #2b3047; border-color: #464d68; }
    }

    /* ============ UPCOMING CARD ============ */
    .hero { padding-top: .2rem; }

    .upcoming-card {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        padding: 1.35rem 1.3rem 1.3rem;
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 1.85rem;
        transition: border-color .35s ease, background .35s ease;
    }
    .upcoming-card.ongoing {
        background: var(--ok-soft);
        border-color: var(--ok-border);
    }

    .upcoming-label {
        display: flex;
        align-items: center;
        gap: .45rem;
        font-family: var(--font-body);
        font-size: .66rem;
        font-weight: 600;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: .6rem;
    }
    .upcoming-card.ongoing .upcoming-label { color: var(--ok); }
    .upcoming-label i { font-size: .72rem; }

    .pulse {
        width: 7px; height: 7px; flex: none;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
    }
    @keyframes pulse {
        0%   { opacity: 1; }
        50%  { opacity: .35; }
        100% { opacity: 1; }
    }

    /* ===== SERIF COUNTDOWN ===== */
    .countdown {
        font-family: var(--font-serif);
        font-optical-sizing: auto;
        font-size: clamp(2.5rem, 12vw, 3.3rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -.015em;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        margin-bottom: .95rem;
        color: var(--text);
    }
    .upcoming-card.ongoing .countdown { color: #d6e8dd; }

    .class-title {
        font-family: var(--font-display);
        font-size: 1.08rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.35;
        letter-spacing: -.015em;
        margin-bottom: .95rem;
    }

    .class-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .45rem;
    }
    .meta-item {
        display: flex; align-items: center; gap: .45rem;
        min-width: 0;
        padding: .48rem .58rem;
        border-radius: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-size: .74rem;
        color: var(--text-2);
    }
    .upcoming-card.ongoing .meta-item {
        background: rgba(255,255,255,.03);
        border-color: rgba(127,174,143,.2);
    }

    /* WHITENED ROOM CARD */
    .meta-item.meta-room {
        background: #f4f5f7;
        border-color: #f4f5f7;
        color: #14161b;
    }
    .meta-item.meta-room i { color: #5b6270; }
    .meta-item.meta-room span {
        color: #14161b;
        font-weight: 600;
    }
    .upcoming-card.ongoing .meta-item.meta-room {
        background: #eef4f0;
        border-color: #eef4f0;
    }

    .meta-item i {
        color: var(--muted);
        font-size: .7rem;
        flex: none;
    }
    .meta-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-body);
        font-weight: 500;
    }

    .progress {
        margin-top: 1rem;
        height: 3px;
        border-radius: 999px;
        background: rgba(255,255,255,.06);
        overflow: hidden;
    }
    .progress i {
        display: block; height: 100%;
        border-radius: 999px;
        background: var(--ok);
        transition: width .9s linear;
    }

    /* ============ SECTION HEAD ============ */
    .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: .75rem;
        margin-bottom: .9rem;
        padding: 0 .15rem;
    }
    .section-title {
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -.015em;
    }
    .section-sub {
        font-family: var(--font-mono);
        font-size: .7rem;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        letter-spacing: .02em;
    }

    /* ============ DAY SELECTOR ============ */
    .day-selector {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        gap: .45rem;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin: 0 -1rem .85rem;
        padding: .5rem 1rem .75rem;
        background: linear-gradient(to bottom,
            rgba(14,15,18,.97) 60%,
            rgba(14,15,18,0) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .day-selector::-webkit-scrollbar { display: none; }

    .day-btn {
        position: relative;
        flex: none;
        font-family: var(--font-body);
        font-size: .8rem;
        font-weight: 500;
        letter-spacing: .005em;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: .48rem 1rem;
        border-radius: 999px;
        cursor: pointer;
        transition: color .2s ease, background .2s ease, border-color .2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .day-btn:active { transform: scale(.97); }
    .day-btn.active {
        color: var(--accent-text);
        background: var(--accent-soft);
        border-color: var(--accent-border);
        font-weight: 600;
    }
    @media (hover: hover) {
        .day-btn:not(.active):hover {
            color: var(--text-2);
            border-color: var(--border-2);
        }
    }

    .today-dot {
        position: absolute;
        top: 6px; right: 8px;
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--accent);
    }
    .day-btn.active .today-dot { background: var(--accent-text); }

    /* ============ SCHEDULE LIST ============ */
    .schedule-list {
        display: flex;
        flex-direction: column;
        gap: .55rem;
        padding-bottom: 1rem;
    }

    .schedule-item {
        position: relative;
        display: flex;
        gap: .9rem;
        padding: .95rem .95rem .95rem 1.05rem;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--border);
        overflow: hidden;
        transition: opacity .3s ease, border-color .3s ease;
    }

    .schedule-item.now {
        background: var(--ok-soft);
        border-color: var(--ok-border);
    }
    .schedule-item.past { opacity: .38; }
    .schedule-item.past .info-title { color: var(--text-2); }

    /* Time rail */
    .time-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .2rem;
        flex: none;
        min-width: 3.4rem;
        padding-top: 2px;
    }
    .t-start {
        font-family: var(--font-mono);
        font-size: .8rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -.01em;
        font-variant-numeric: tabular-nums;
    }
    .t-end {
        font-family: var(--font-mono);
        font-size: .68rem;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }
    .t-line {
        width: 1px;
        flex: 1;
        min-height: 10px;
        background: var(--border-2);
    }

    .info-col { flex: 1; min-width: 0; }

    .info-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: .5rem;
        margin-bottom: .55rem;
    }
    .info-title {
        font-family: var(--font-display);
        font-size: .92rem;
        font-weight: 600;
        line-height: 1.35;
        color: var(--text);
        letter-spacing: -.01em;
    }

    .now-pill {
        display: inline-flex;
        align-items: center;
        gap: .32rem;
        flex: none;
        font-family: var(--font-body);
        font-size: .58rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--ok);
        background: rgba(127,174,143,.1);
        border: 1px solid rgba(127,174,143,.25);
        padding: .16rem .42rem;
        border-radius: 999px;
        margin-top: 2px;
    }

    .info-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .4rem;
        font-size: .73rem;
        color: var(--muted);
    }
    .info-meta .meta {
        display: inline-flex;
        align-items: center;
        gap: .32rem;
        min-width: 0;
        font-family: var(--font-body);
        font-weight: 500;
    }
    .info-meta .meta i {
        font-size: .66rem;
        opacity: .75;
        color: var(--muted-2);
    }

    /* WHITENED ROOM META */
    .info-meta .meta-room {
        background: #f4f5f7;
        border: 1px solid #f4f5f7;
        color: #14161b;
        font-weight: 600;
        padding: .18rem .5rem;
        border-radius: 7px;
    }
    .info-meta .meta-room i {
        color: #5b6270;
        opacity: 1;
    }
    .schedule-item.now .info-meta .meta-room {
        background: #eef4f0;
        border-color: #eef4f0;
    }
    .schedule-item.past .info-meta .meta-room {
        opacity: .85;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: .3rem;
        font-family: var(--font-body);
        font-size: .62rem;
        font-weight: 600;
        letter-spacing: .07em;
        text-transform: uppercase;
        padding: .2rem .5rem;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
    }
    .badge i { font-size: .6rem; opacity: .9; }
    .badge.theory {
        color: var(--theory);
        border-color: rgba(139,163,199,.28);
        background: rgba(139,163,199,.07);
    }
    .badge.lab {
        color: var(--lab);
        border-color: rgba(199,167,124,.28);
        background: rgba(199,167,124,.07);
    }
    .badge.tut {
        color: var(--tut);
        border-color: rgba(134,179,154,.28);
        background: rgba(134,179,154,.07);
    }

    /* ============ BREAK GAP ============ */
    .break-item {
        display: flex;
        align-items: center;
        gap: .6rem;
        padding: .3rem .3rem;
    }
    .break-line {
        flex: 1;
        height: 0;
        border-top: 1px dashed var(--border-2);
    }
    .break-chip {
        display: inline-flex;
        align-items: center;
        gap: .42rem;
        flex: none;
        font-family: var(--font-body);
        font-size: .64rem;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: .28rem .65rem;
        border-radius: 999px;
        white-space: nowrap;
    }
    .break-chip i { font-size: .68rem; color: var(--muted-2); }

    /* ============ EMPTY STATE ============ */
    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .3rem;
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
    }
    .empty-state i {
        font-size: 1.7rem;
        margin-bottom: .4rem;
        color: var(--muted-2);
    }
    .empty-state p {
        font-family: var(--font-display);
        font-size: .95rem;
        font-weight: 600;
        color: var(--text-2);
    }
    .empty-state span { font-size: .78rem; }
    .empty-state.small { padding: 1.5rem 1rem; }

    /* ============ BATCH MODAL (CENTERED) ============ */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 9, 12, .82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s ease;
        padding: 1rem;
    }
    .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
    }

    .modal {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border-2);
        border-radius: 22px;
        padding: 1.65rem 1.4rem 1.4rem;
        transform: translateY(18px) scale(.97);
        transition: transform .38s cubic-bezier(.22, 1, .36, 1);
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
    }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

    .modal-icon {
        width: 44px; height: 44px;
        border-radius: 13px;
        display: grid; place-items: center;
        font-size: 1.05rem;
        color: var(--accent-text);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        margin-bottom: 1rem;
    }

    .modal h2 {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -.02em;
        color: var(--text);
        margin-bottom: .4rem;
    }
    .modal > p {
        font-size: .84rem;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 1.35rem;
    }

    .batch-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: .55rem;
        margin-bottom: 1.2rem;
    }
    .batch-btn {
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: .01em;
        color: var(--text-2);
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        padding: .95rem .5rem;
        border-radius: 13px;
        cursor: pointer;
        transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .3rem;
    }
    .batch-btn .b-code {
        font-family: var(--font-mono);
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1;
    }
    .batch-btn .b-hint {
        font-family: var(--font-body);
        font-size: .62rem;
        font-weight: 500;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .batch-btn:active { transform: scale(.97); }
    .batch-btn.selected {
        color: var(--accent-text);
        background: var(--accent-soft);
        border-color: var(--accent-border);
    }
    .batch-btn.selected .b-code { color: var(--accent-text); }
    .batch-btn.selected .b-hint { color: var(--accent); }
    @media (hover: hover) {
        .batch-btn:not(.selected):hover {
            background: var(--surface-3);
            border-color: var(--border-3);
        }
    }

    .modal-note {
        display: flex;
        align-items: flex-start;
        gap: .5rem;
        font-size: .72rem;
        color: var(--muted);
        line-height: 1.45;
        padding: .7rem .8rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 11px;
        margin-bottom: 1.1rem;
    }
    .modal-note i {
        color: var(--muted-2);
        font-size: .78rem;
        margin-top: 2px;
        flex: none;
    }

    .modal-actions {
        display: flex;
        gap: .55rem;
    }
    .btn {
        flex: 1;
        font-family: var(--font-body);
        font-size: .84rem;
        font-weight: 600;
        letter-spacing: .01em;
        padding: .78rem 1rem;
        border-radius: 12px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background .18s ease, border-color .18s ease, color .18s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
        background: var(--accent-soft);
        color: var(--accent-text);
        border-color: var(--accent-border);
    }
    .btn-primary:disabled {
        opacity: .4;
        cursor: not-allowed;
    }
    .btn-ghost {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
    }
    @media (hover: hover) {
        .btn-primary:not(:disabled):hover { background: #2b3047; border-color: #464d68; }
        .btn-ghost:hover { color: var(--text-2); border-color: var(--border-2); }
    }

    /* ============ SCROLL REVEAL ============ */
    .reveal {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity .5s cubic-bezier(.22, 1, .36, 1),
                    transform .5s cubic-bezier(.22, 1, .36, 1);
        will-change: opacity, transform;
    }
    .reveal.in { opacity: 1; transform: none; }

    /* ============ RESPONSIVE ============ */
    @media (min-width: 480px) {
        .info-title { font-size: .96rem; }
    }

    @media (min-width: 720px) {
        body { padding-left: 1.5rem; padding-right: 1.5rem; }
        .app-header { padding-top: 1.75rem; }
        .brand-text h1 { font-size: 1.1rem; }
        .upcoming-card { padding: 1.6rem 1.6rem 1.5rem; }
        .countdown { font-size: 3.6rem; }
        .class-title { font-size: 1.22rem; }
        .class-meta { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .day-selector {
            margin-left: -1.5rem;
            margin-right: -1.5rem;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .info-title { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
        .pulse { animation: none !important; }
        * { transition-duration: .01ms !important; }
    }
</style>
</head>
<body>

<header class="app-header reveal">
    <div class="brand">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="brand-text">
            <h1>FY CSAIML-C</h1>
            <p>Semester 1 · Timetable</p>
        </div>
    </div>
    <div class="header-tools">
        <button class="batch-chip" id="batchChip" aria-label="Change batch">
            <i class="fa-solid fa-users-rectangle"></i>
            <span id="batchChipText">—</span>
        </button>
    </div>
</header>

<main>
    <section class="hero reveal">
        <div class="upcoming-card" id="upcoming-card"></div>
    </section>

    <section class="schedule-section">
        <div class="section-head reveal">
            <h2 class="section-title">Schedule</h2>
            <span class="section-sub" id="day-count"></span>
        </div>

        <div class="day-selector" id="day-selector"></div>
        <div class="schedule-list" id="schedule-list"></div>
    </section>
</main>

<!-- ============ BATCH MODAL ============ -->
<div class="modal-backdrop" id="batchModal" role="dialog" aria-modal="true" aria-labelledby="batchTitle">
    <div class="modal">
        <div class="modal-icon"><i class="fa-solid fa-users-rectangle"></i></div>
        <h2 id="batchTitle">Select your batch</h2>
        <p>Lab sessions are split across batches. Pick yours to see the correct schedule.</p>

        <div class="batch-grid" id="batchGrid">
            <button class="batch-btn" data-batch="B1">
                <span class="b-code">B1</span>
                <span class="b-hint">Batch 1</span>
            </button>
            <button class="batch-btn" data-batch="B2">
                <span class="b-code">B2</span>
                <span class="b-hint">Batch 2</span>
            </button>
            <button class="batch-btn" data-batch="B3">
                <span class="b-code">B3</span>
                <span class="b-hint">Batch 3</span>
            </button>
        </div>

        <div class="modal-note">
            <i class="fa-solid fa-circle-info"></i>
            <span>You can change your batch anytime by tapping the batch chip in the header.</span>
        </div>

        <div class="modal-actions" id="modalActions">
            <button class="btn btn-ghost" id="cancelBtn" hidden>Cancel</button>
            <button class="btn btn-primary" id="confirmBtn" disabled>Continue</button>
        </div>
    </div>
</div>

<script>
/* =====================================================
   DATA
   ===================================================== */
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const WEEK = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

const MASTER_SCHEDULE = {
    Monday: [
        { start: "10:00", end: "11:00", subject: "Logic and Quantitative Aptitude 1", type: "Theory", room: "1123", teacher: "VSS" },
        { start: "11:00", end: "12:00", subject: "Logic and Quantitative Aptitude 1", type: "Theory", room: "1123", teacher: "VSS" },
        { start: "12:00", end: "13:00", subject: "Environment Studies", type: "Theory", room: "1123", teacher: "ADL" },
        {
            start: "14:00", end: "16:00",
            subject: "Prog for Engg (B1,B3) / Robotics (B2)",
            type: "Lab",
            room: "1225 / 1226 / 1202",
            batchRooms: { B1: "1225", B2: "1202", B3: "1226" },
            teacher: "PVB / SGJ / SHB"
        },
        { start: "16:00", end: "17:00", subject: "Calculus", type: "Theory", room: "1124", teacher: "SVT" }
    ],
    Tuesday: [
        { start: "10:00", end: "11:00", subject: "Language-English", type: "Theory", room: "1123", teacher: "VW" },
        { start: "11:00", end: "12:00", subject: "Engineering Robotics", type: "Theory", room: "1123", teacher: "SHB" },
        { start: "12:00", end: "13:00", subject: "Environment Studies", type: "Theory", room: "1123", teacher: "ADL" },
        {
            start: "14:00", end: "16:00",
            subject: "Prog for Engg (B2) / Robotics (B1)",
            type: "Lab",
            room: "1225 / 1202",
            batchRooms: { B1: "1202", B2: "1225" },
            teacher: "PVB / SHB"
        },
        { start: "16:00", end: "17:00", subject: "Calculus", type: "Theory", room: "1123", teacher: "SVT" }
    ],
    Wednesday: [
        { start: "10:00", end: "11:00", subject: "Language-English", type: "Theory", room: "1123", teacher: "VW" },
        { start: "11:00", end: "12:00", subject: "Environment Studies", type: "Theory", room: "1123", teacher: "ADL" },
        { start: "12:00", end: "13:00", subject: "Calculus", type: "Theory", room: "1123", teacher: "SVT" },
        {
            start: "14:00", end: "16:00",
            subject: "Prog for Engg (B1) / Robotics (B3)",
            type: "Lab",
            room: "1225 / 1202",
            batchRooms: { B1: "1225", B3: "1202" },
            teacher: "PVB / SHB"
        },
        { start: "15:00", end: "16:00", subject: "Calculus Tutorial (B2)", type: "Tutorial", room: "1409", teacher: "SVT" }
    ],
    Thursday: [
        { start: "10:00", end: "11:00", subject: "Design Thinking & Ideation", type: "Theory", room: "1123", teacher: "MBD" },
        { start: "11:00", end: "12:00", subject: "Programming for Engineers", type: "Theory", room: "1123", teacher: "PVB" },
        { start: "14:00", end: "16:00", subject: "Programming for Engineers (B2)", type: "Lab", room: "1225", teacher: "PVB" },
        { start: "14:00", end: "15:00", subject: "Calculus Tutorial (B1)", type: "Tutorial", room: "1409", teacher: "SVT" },
        { start: "15:00", end: "16:00", subject: "Calculus Tutorial (B3)", type: "Tutorial", room: "1409", teacher: "SVT" },
        { start: "16:00", end: "17:00", subject: "Engineering Robotics", type: "Theory", room: "1123", teacher: "SHB" }
    ],
    Friday: [
        { start: "10:00", end: "11:00", subject: "Programming for Engineers", type: "Theory", room: "1123", teacher: "PVB" },
        { start: "11:00", end: "12:00", subject: "Design Thinking & Ideation", type: "Theory", room: "1123", teacher: "MBD" },
        { start: "14:00", end: "16:00", subject: "Programming for Engineers (B3)", type: "Lab", room: "1226", teacher: "SMP" }
    ]
};

const TYPE_META = {
    Theory:   { cls: "theory", icon: "fa-book-open" },
    Lab:      { cls: "lab",    icon: "fa-flask" },
    Tutorial: { cls: "tut",    icon: "fa-pen-ruler" }
};

const BATCH_KEY = "fy_csaiml_c_batch_v1";
const VALID_BATCHES = ["B1", "B2", "B3"];

/* =====================================================
   HELPERS
   ===================================================== */
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const pad = n => String(n).padStart(2, "0");
const nowSeconds = () => { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); };

function fmtDuration(mins) {
    const h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return `${h}h ${m}m`;
    if (h) return `${h}h`;
    return `${m}m`;
}

function resolveEntryForBatch(entry, batch) {
    if (!batch) return entry;

    let result = { ...entry };
    if (entry.batchRooms && entry.batchRooms[batch]) {
        result.room = entry.batchRooms[batch];
    }

    if (entry.type !== "Lab" && entry.type !== "Tutorial") return result;

    const subj = entry.subject;

    if (subj.includes("/")) {
        const parts = subj.split("/").map(s => s.trim());
        for (const part of parts) {
            const m = part.match(/\(([^)]+)\)/);
            if (!m) continue;
            const batches = m[1].split(",").map(x => x.trim());
            if (batches.includes(batch)) {
                result.subject = part.replace(/\s*\([^)]*\)\s*/g, " ").trim();
                return result;
            }
        }
        return null;
    }

    const m = subj.match(/\(([^)]+)\)\s*$/);
    if (m) {
        const batches = m[1].split(",").map(x => x.trim());
        if (!batches.includes(batch)) return null;
        result.subject = subj.replace(/\s*\([^)]*\)\s*$/, "").trim();
        return result;
    }

    return result;
}

function getScheduleForBatch(batch) {
    const out = {};
    for (const day of Object.keys(MASTER_SCHEDULE)) {
        out[day] = MASTER_SCHEDULE[day]
            .map(e => resolveEntryForBatch(e, batch))
            .filter(Boolean);
    }
    return out;
}

/* =====================================================
   STATE
   ===================================================== */
let currentBatch = null;
let activeSchedule = MASTER_SCHEDULE;
let selectedDay = DAYS[new Date().getDay()];
if (!WEEK.includes(selectedDay)) selectedDay = "Monday";

const daySelectorEl = document.getElementById("day-selector");
const scheduleListEl = document.getElementById("schedule-list");
const upcomingCardEl = document.getElementById("upcoming-card");
const dayCountEl = document.getElementById("day-count");

/* =====================================================
   SCROLL REVEAL
   ===================================================== */
const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("in");
            revealObserver.unobserve(entry.target);
        }
    });
}, { threshold: 0.06, rootMargin: "0px 0px -6% 0px" });

function observeReveals() {
    document.querySelectorAll(".reveal:not(.in)").forEach(el => revealObserver.observe(el));
}

/* =====================================================
   TIMELINE (with breaks)
   ===================================================== */
function buildTimeline(items) {
    const sorted = items
        .map((it, i) => ({ ...it, _i: i }))
        .sort((a, b) => (toMin(a.start) - toMin(b.start)) || (toMin(a.end) - toMin(b.end)));

    const out = [];
    let cursor = null;

    for (const it of sorted) {
        const s = toMin(it.start), e = toMin(it.end);
        if (cursor !== null && s > cursor) {
            out.push({ kind: "break", startMin: cursor, endMin: s, minutes: s - cursor });
        }
        out.push({ kind: "class", ...it });
        cursor = cursor === null ? e : Math.max(cursor, e);
    }
    return out;
}

function breakMeta(startMin, minutes) {
    const isMidday = startMin >= 12 * 60 && startMin < 15 * 60 + 30;
    if (isMidday && minutes >= 40) return { icon: "fa-utensils", label: "Lunch" };
    if (minutes >= 90) return { icon: "fa-mug-hot", label: "Long Break" };
    return { icon: "fa-mug-hot", label: "Break" };
}

/* =====================================================
   DAY SELECTOR
   ===================================================== */
function renderDaySelector() {
    const todayName = DAYS[new Date().getDay()];

    daySelectorEl.innerHTML = WEEK.map(day => {
        const isToday = day === todayName;
        const active = day === selectedDay;
        return `<button class="day-btn${active ? " active" : ""}" data-day="${day}" aria-pressed="${active}">
            ${day.slice(0, 3)}${isToday ? '<span class="today-dot"></span>' : ""}
        </button>`;
    }).join("");

    daySelectorEl.querySelectorAll(".day-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            if (btn.dataset.day === selectedDay) return;
            selectedDay = btn.dataset.day;
            renderDaySelector();
            renderSchedule(true);
        });
    });

    const activeBtn = daySelectorEl.querySelector(".day-btn.active");
    if (activeBtn) {
        activeBtn.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }
}

/* =====================================================
   SCHEDULE LIST
   ===================================================== */
function renderSchedule(animate = true) {
    const now = new Date();
    const isToday = selectedDay === DAYS[now.getDay()];
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const items = activeSchedule[selectedDay] || [];

    dayCountEl.textContent = items.length
        ? `${items.length} session${items.length > 1 ? "s" : ""}`
        : "";

    if (!items.length) {
        scheduleListEl.innerHTML = `
            <div class="empty-state reveal">
                <i class="fa-regular fa-calendar"></i>
                <p>No classes scheduled</p>
                <span>Enjoy your day off</span>
            </div>`;
        if (animate) observeReveals();
        else scheduleListEl.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
        return;
    }

    const timeline = buildTimeline(items);
    let html = "";

    timeline.forEach((entry, idx) => {
        const delay = Math.min(idx, 12) * 40;

        if (entry.kind === "break") {
            const meta = breakMeta(entry.startMin, entry.minutes);
            html += `
                <div class="break-item reveal" style="transition-delay:${delay}ms">
                    <span class="break-line"></span>
                    <span class="break-chip">
                        <i class="fa-solid ${meta.icon}"></i>
                        ${meta.label} · ${fmtDuration(entry.minutes)}
                    </span>
                    <span class="break-line"></span>
                </div>`;
            return;
        }

        const t = TYPE_META[entry.type] || TYPE_META.Theory;

        let state = "";
        if (isToday) {
            const s = toMin(entry.start), e = toMin(entry.end);
            if (nowMin >= e) state = "past";
            else if (nowMin >= s) state = "now";
        }

        html += `
            <article class="schedule-item reveal ${state}" style="transition-delay:${delay}ms">
                <div class="time-rail">
                    <span class="t-start">${entry.start}</span>
                    <span class="t-line"></span>
                    <span class="t-end">${entry.end}</span>
                </div>
                <div class="info-col">
                    <div class="info-top">
                        <h3 class="info-title">${entry.subject}</h3>
                        ${state === "now" ? '<span class="now-pill"><span class="pulse"></span>Now</span>' : ""}
                    </div>
                    <div class="info-meta">
                        <span class="badge ${t.cls}">
                            <i class="fa-solid ${t.icon}"></i>${entry.type}
                        </span>
                        <span class="meta meta-room"><i class="fa-solid fa-door-open"></i>${entry.room || "—"}</span>
                        <span class="meta"><i class="fa-solid fa-user-tie"></i>${entry.teacher || "—"}</span>
                    </div>
                </div>
            </article>`;
    });

    scheduleListEl.innerHTML = html;

    if (animate) observeReveals();
    else scheduleListEl.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
}

/* =====================================================
   UPCOMING / ONGOING CARD
   ===================================================== */
function getUpcoming() {
    const now = new Date();
    const nowSec = nowSeconds();
    const nowMin = nowSec / 60;
    const todayName = DAYS[now.getDay()];

    const todayItems = (activeSchedule[todayName] || [])
        .slice()
        .sort((a, b) => toMin(a.start) - toMin(b.start));

    const ongoing = todayItems
        .filter(c => toMin(c.start) <= nowMin && toMin(c.end) > nowMin)
        .sort((a, b) => toMin(b.start) - toMin(a.start));

    if (ongoing.length) {
        const c = ongoing[0];
        return {
            cls: c,
            ongoing: true,
            secondsLeft: toMin(c.end) * 60 - nowSec,
            dayLabel: "Today"
        };
    }

    const soon = todayItems.find(c => toMin(c.start) > nowMin);
    if (soon) {
        return {
            cls: soon,
            ongoing: false,
            secondsLeft: toMin(soon.start) * 60 - nowSec,
            dayLabel: "Today"
        };
    }

    for (let i = 1; i <= 7; i++) {
        const dayName = DAYS[(now.getDay() + i) % 7];
        const list = activeSchedule[dayName];
        if (list && list.length) {
            const first = [...list].sort((a, b) => toMin(a.start) - toMin(b.start))[0];
            return {
                cls: first,
                ongoing: false,
                secondsLeft: toMin(first.start) * 60 - nowSec + i * 86400,
                dayLabel: i === 1 ? "Tomorrow" : dayName
            };
        }
    }
    return null;
}

let lastCardKey = "__init__";

function renderUpcoming() {
    const data = getUpcoming();

    if (!data) {
        if (lastCardKey === "none") return;
        lastCardKey = "none";
        upcomingCardEl.className = "upcoming-card reveal in";
        upcomingCardEl.innerHTML = `
            <div class="empty-state small">
                <i class="fa-regular fa-calendar"></i>
                <p>No upcoming classes</p>
            </div>`;
        return;
    }

    const { cls, ongoing, secondsLeft, dayLabel } = data;
    const t = TYPE_META[cls.type] || TYPE_META.Theory;

    const secs = Math.max(0, secondsLeft);
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    const timeStr = h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;

    let progress = 0;
    if (ongoing) {
        const s0 = toMin(cls.start) * 60;
        const e0 = toMin(cls.end) * 60;
        const ns = nowSeconds();
        progress = Math.min(100, Math.max(0, ((ns - s0) / (e0 - s0)) * 100));
    }

    const key = `${cls.subject}|${cls.start}|${cls.end}|${ongoing}|${dayLabel}|${cls.room}`;

    if (key === lastCardKey) {
        const cd = document.getElementById("countdown");
        if (cd) cd.textContent = timeStr;
        const bar = document.getElementById("progress-bar");
        if (bar) bar.style.width = progress + "%";
        return;
    }
    lastCardKey = key;

    upcomingCardEl.className = `upcoming-card reveal in${ongoing ? " ongoing" : ""}`;
    upcomingCardEl.innerHTML = `
        <div class="upcoming-label">
            ${ongoing
                ? '<span class="pulse"></span>Ongoing · ends in'
                : `<i class="fa-regular fa-hourglass-half"></i>Next class in${dayLabel !== "Today" ? ` · ${dayLabel}` : ""}`}
        </div>
        <div class="countdown" id="countdown">${timeStr}</div>
        <div class="class-title">${cls.subject}</div>
        <div class="class-meta">
            <div class="meta-item">
                <i class="fa-regular fa-clock"></i>
                <span>${cls.start} – ${cls.end}</span>
            </div>
            <div class="meta-item meta-room">
                <i class="fa-solid fa-door-open"></i>
                <span>Room ${cls.room || "—"}</span>
            </div>
            <div class="meta-item">
                <i class="fa-solid fa-user-tie"></i>
                <span>${cls.teacher || "—"}</span>
            </div>
            <div class="meta-item">
                <i class="fa-solid ${t.icon}"></i>
                <span>${cls.type}${dayLabel !== "Today" ? " · " + dayLabel : ""}</span>
            </div>
        </div>
        ${ongoing ? `<div class="progress"><i id="progress-bar" style="width:${progress}%"></i></div>` : ""}
    `;
}

/* =====================================================
   BATCH MODAL
   ===================================================== */
const modalEl = document.getElementById("batchModal");
const batchGridEl = document.getElementById("batchGrid");
const confirmBtn = document.getElementById("confirmBtn");
const cancelBtn = document.getElementById("cancelBtn");
const batchChipEl = document.getElementById("batchChip");
const batchChipTextEl = document.getElementById("batchChipText");

let pendingBatch = null;
let isInitialSetup = true;

function openBatchModal(isInitial) {
    isInitialSetup = !!isInitial;
    pendingBatch = isInitial ? null : currentBatch;
    updateBatchSelectionUI();
    cancelBtn.hidden = isInitial;
    confirmBtn.textContent = isInitial ? "Continue" : "Save";
    modalEl.classList.add("open");
    document.body.style.overflow = "hidden";

    setTimeout(() => {
        const first = batchGridEl.querySelector(".batch-btn");
        if (first) first.focus({ preventScroll: true });
    }, 150);
}

function closeBatchModal() {
    modalEl.classList.remove("open");
    document.body.style.overflow = "";
}

function updateBatchSelectionUI() {
    batchGridEl.querySelectorAll(".batch-btn").forEach(btn => {
        btn.classList.toggle("selected", btn.dataset.batch === pendingBatch);
    });
    confirmBtn.disabled = !pendingBatch;
}

function applyBatch(batch) {
    currentBatch = batch;
    activeSchedule = getScheduleForBatch(batch);
    batchChipTextEl.textContent = batch;

    lastCardKey = "__init__";
    renderSchedule(false);
    renderUpcoming();
}

batchGridEl.querySelectorAll(".batch-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        pendingBatch = btn.dataset.batch;
        updateBatchSelectionUI();
    });
});

confirmBtn.addEventListener("click", () => {
    if (!pendingBatch) return;
    try { localStorage.setItem(BATCH_KEY, pendingBatch); } catch (e) {}
    applyBatch(pendingBatch);
    closeBatchModal();
});

cancelBtn.addEventListener("click", () => {
    if (isInitialSetup) return;
    closeBatchModal();
});

modalEl.addEventListener("click", (e) => {
    if (e.target === modalEl && !isInitialSetup) closeBatchModal();
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalEl.classList.contains("open") && !isInitialSetup) {
        closeBatchModal();
    }
});

batchChipEl.addEventListener("click", () => openBatchModal(false));

/* =====================================================
   BOOT
   ===================================================== */
function boot() {
    let savedBatch = null;
    try { savedBatch = localStorage.getItem(BATCH_KEY); } catch (e) {}
    if (!VALID_BATCHES.includes(savedBatch)) savedBatch = null;

    renderDaySelector();

    if (savedBatch) {
        currentBatch = savedBatch;
        activeSchedule = getScheduleForBatch(savedBatch);
        batchChipTextEl.textContent = savedBatch;
        renderSchedule(true);
        renderUpcoming();
        observeReveals();
    } else {
        currentBatch = null;
        activeSchedule = MASTER_SCHEDULE;
        batchChipTextEl.textContent = "—";
        renderSchedule(true);
        renderUpcoming();
        observeReveals();
        openBatchModal(true);
    }
}

boot();

/* =====================================================
   INTERVALS
   ===================================================== */
setInterval(() => {
    renderUpcoming();
}, 1000);

setInterval(() => {
    renderSchedule(false);
}, 30000);

let lastDayName = DAYS[new Date().getDay()];
setInterval(() => {
    const todayName = DAYS[new Date().getDay()];
    if (todayName !== lastDayName) {
        lastDayName = todayName;
        if (!WEEK.includes(selectedDay)) selectedDay = "Monday";
        renderDaySelector();
        renderSchedule(false);
        lastCardKey = "__init__";
        renderUpcoming();
    }
}, 60000);
</script>
</body>
</html>
