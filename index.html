<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>FY CSAIML-C · Timetable</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    :root {
        --font-display: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --font-serif: "Fraunces", "Playfair Display", Georgia, "Times New Roman", serif;

        --bg: #0e0f12;
        --surface: #16181d;
        --surface-2: #1c1f26;
        --surface-3: #22252e;
        --border: #23262d;
        --border-2: #2e323c;
        --border-3: #3a3f4c;

        --text: #e8eaee;
        --text-2: #b4b8c2;
        --muted: #72767f;
        --muted-2: #565a63;

        --accent: #8b93c4;
        --accent-soft: #262a3d;
        --accent-border: #3a4058;
        --accent-text: #c5cbe8;

        --ok: #7fae8f;
        --ok-soft: #1c2a22;
        --ok-border: #35493c;

        --hero-bg: #000000;
        --hero-border: #171717;
        --hero-text: #ffffff;
        --hero-muted: #8a8d95;
        --hero-meta-bg: #0d0d0d;
        --hero-meta-border: #1c1c1c;
        --hero-meta-text: #c8cad0;
        --hero-meta-icon: #6c6f78;

        --room-bg: #f4f5f7;
        --room-border: #f4f5f7;
        --room-text: #14161b;
        --room-icon: #5b6270;

        --theory-text: #8ba3c7;
        --theory-bg: rgba(139,163,199,.07);
        --theory-border: rgba(139,163,199,.28);

        --lab-text: #c7a77c;
        --lab-bg: rgba(199,167,124,.07);
        --lab-border: rgba(199,167,124,.28);

        --tut-text: #86b39a;
        --tut-bg: rgba(134,179,154,.07);
        --tut-border: rgba(134,179,154,.28);

        --schedule-now-bg: #1c2a22;
        --schedule-now-border: #35493c;

        --shadow: 0 1px 2px rgba(0,0,0,.4);
        --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        padding: 0 1rem calc(3rem + env(safe-area-inset-bottom));
        padding-top: env(safe-area-inset-top);
        max-width: 760px;
        margin: 0 auto;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        font-feature-settings: "cv11", "ss01";
    }

    /* =========================
       HEADER
       ========================= */

    .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .85rem;
        padding: 1.3rem 0 1rem;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: .7rem;
        min-width: 0;
    }

    .logo {
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: .95rem;
        color: var(--accent-text);
        background: var(--surface-2);
        border: 1px solid var(--border-2);
    }

    .brand-text {
        min-width: 0;
    }

    .brand-text h1 {
        font-family: var(--font-display);
        font-size: .98rem;
        font-weight: 700;
        letter-spacing: -.02em;
        color: var(--text);
        line-height: 1.2;
        white-space: nowrap;
    }

    .brand-text p {
        font-family: var(--font-body);
        font-size: .7rem;
        color: var(--muted);
        letter-spacing: .01em;
        margin-top: 1px;
    }

    .header-tools {
        display: flex;
        align-items: center;
        gap: .4rem;
        flex: none;
    }

    .batch-chip {
        display: inline-flex;
        align-items: center;
        gap: .38rem;
        font-family: var(--font-mono);
        font-size: .7rem;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--accent-text);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        padding: .4rem .6rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background .2s ease, border-color .2s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .batch-chip i {
        font-size: .66rem;
        opacity: .85;
    }

    .batch-chip:active {
        transform: scale(.97);
    }

    @media (hover: hover) {
        .batch-chip:hover {
            background: var(--surface-3);
            border-color: var(--border-3);
        }
    }

    /* =========================
       HERO
       ========================= */

    .hero {
        padding-top: .15rem;
    }

    .upcoming-card {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        padding: 1.2rem 1.15rem 1.15rem;
        background: var(--hero-bg);
        border: 1px solid var(--hero-border);
        margin-bottom: 1.6rem;
        color: var(--hero-text);
        box-shadow: var(--shadow-lg);
    }

    .upcoming-card.ongoing {
        background: #06110b;
        border-color: #14301f;
    }

    .upcoming-label {
        display: flex;
        align-items: center;
        gap: .42rem;
        font-family: var(--font-body);
        font-size: .64rem;
        font-weight: 600;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--hero-muted);
        margin-bottom: .55rem;
    }

    .upcoming-card.ongoing .upcoming-label {
        color: #6fc28d;
    }

    .upcoming-label i {
        font-size: .7rem;
    }

    .pulse {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
    }

    @keyframes pulse {
        0%   { opacity: 1; }
        50%  { opacity: .35; }
        100% { opacity: 1; }
    }

    .countdown {
        font-family: var(--font-serif);
        font-optical-sizing: auto;
        font-size: clamp(2.3rem, 11vw, 3rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -.015em;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        margin-bottom: .85rem;
        color: var(--hero-text);
    }

    .upcoming-card.ongoing .countdown {
        color: #d6e8dd;
    }

    .class-title {
        font-family: var(--font-display);
        font-size: 1.02rem;
        font-weight: 600;
        color: var(--hero-text);
        line-height: 1.35;
        letter-spacing: -.015em;
        margin-bottom: .85rem;
    }

    .class-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .4rem;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: .4rem;
        min-width: 0;
        padding: .42rem .55rem;
        border-radius: 9px;
        background: var(--hero-meta-bg);
        border: 1px solid var(--hero-meta-border);
        font-size: .72rem;
        color: var(--hero-meta-text);
    }

    .meta-item i {
        color: var(--hero-meta-icon);
        font-size: .68rem;
        flex: none;
    }

    .meta-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-body);
        font-weight: 500;
    }

    .meta-item.meta-room {
        background: var(--room-bg);
        border-color: var(--room-border);
        color: var(--room-text);
    }

    .meta-item.meta-room i {
        color: var(--room-icon);
    }

    .meta-item.meta-room span {
        color: var(--room-text);
        font-weight: 600;
    }

    .progress {
        margin-top: .85rem;
        height: 3px;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        overflow: hidden;
    }

    .progress i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: #4fae76;
        transition: width .9s linear;
    }

    /* =========================
       SECTION
       ========================= */

    .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: .75rem;
        margin-bottom: .8rem;
        padding: 0 .1rem;
    }

    .section-title {
        font-family: var(--font-display);
        font-size: .95rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -.015em;
    }

    .section-sub {
        font-family: var(--font-mono);
        font-size: .68rem;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    /* =========================
       DAY SELECTOR
       ========================= */

    .day-selector {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        gap: .4rem;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin: 0 -1rem .75rem;
        padding: .5rem 1rem .7rem;
        background: linear-gradient(
            to bottom,
            var(--bg) 55%,
            transparent 100%
        );
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .day-selector::-webkit-scrollbar {
        display: none;
    }

    .day-btn {
        position: relative;
        flex: none;
        font-family: var(--font-body);
        font-size: .78rem;
        font-weight: 500;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: .42rem .95rem;
        border-radius: 999px;
        cursor: pointer;
        transition:
            color .2s ease,
            background .2s ease,
            border-color .2s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .day-btn:active {
        transform: scale(.97);
    }

    .day-btn.active {
        color: var(--accent-text);
        background: var(--accent-soft);
        border-color: var(--accent-border);
        font-weight: 600;
    }

    @media (hover: hover) {
        .day-btn:not(.active):hover {
            color: var(--text-2);
            border-color: var(--border-2);
        }
    }

    .today-dot {
        position: absolute;
        top: 6px;
        right: 7px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
    }

    .day-btn.active .today-dot {
        background: var(--accent-text);
    }

    /* =========================
       SCHEDULE
       ========================= */

    .schedule-list {
        display: flex;
        flex-direction: column;
        gap: .45rem;
        padding-bottom: 1rem;
    }

    .schedule-item {
        position: relative;
        display: flex;
        gap: .8rem;
        padding: .78rem .85rem;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        overflow: hidden;
        transition:
            opacity .3s ease,
            border-color .3s ease,
            background .3s ease;
    }

    .schedule-item.now {
        background: var(--schedule-now-bg);
        border-color: var(--schedule-now-border);
    }

    .schedule-item.past {
        opacity: .4;
    }

    .time-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .15rem;
        flex: none;
        min-width: 3.1rem;
        padding-top: 1px;
    }

    .t-start {
        font-family: var(--font-mono);
        font-size: .74rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -.01em;
        font-variant-numeric: tabular-nums;
    }

    .t-end {
        font-family: var(--font-mono);
        font-size: .62rem;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .t-line {
        width: 1px;
        flex: 1;
        min-height: 8px;
        background: var(--border-2);
    }

    .info-col {
        flex: 1;
        min-width: 0;
    }

    .info-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: .45rem;
        margin-bottom: .45rem;
    }

    .info-title {
        font-family: var(--font-display);
        font-size: .86rem;
        font-weight: 600;
        line-height: 1.32;
        color: var(--text);
        letter-spacing: -.01em;
    }

    .now-pill {
        display: inline-flex;
        align-items: center;
        gap: .28rem;
        flex: none;
        font-family: var(--font-body);
        font-size: .56rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--ok);
        background: var(--ok-soft);
        border: 1px solid var(--ok-border);
        padding: .14rem .38rem;
        border-radius: 999px;
        margin-top: 2px;
    }

    .info-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .35rem;
        font-size: .7rem;
        color: var(--muted);
    }

    .info-meta .meta {
        display: inline-flex;
        align-items: center;
        gap: .28rem;
        min-width: 0;
        font-family: var(--font-body);
        font-weight: 500;
    }

    .info-meta .meta i {
        font-size: .62rem;
        opacity: .85;
        color: var(--muted-2);
    }

    .info-meta .meta-room {
        background: var(--room-bg);
        border: 1px solid var(--room-border);
        color: var(--room-text);
        font-weight: 600;
        padding: .14rem .45rem;
        border-radius: 6px;
    }

    .info-meta .meta-room i {
        color: var(--room-icon);
        opacity: 1;
    }

    /* =========================
       BADGES
       ========================= */

    .badge {
        display: inline-flex;
        align-items: center;
        gap: .26rem;
        font-family: var(--font-body);
        font-size: .58rem;
        font-weight: 600;
        letter-spacing: .07em;
        text-transform: uppercase;
        padding: .16rem .42rem;
        border-radius: 5px;
        border: 1px solid transparent;
        background: transparent;
    }

    .badge i {
        font-size: .56rem;
        opacity: .9;
    }

    .badge.theory {
        color: var(--theory-text);
        border-color: var(--theory-border);
        background: var(--theory-bg);
    }

    .badge.lab {
        color: var(--lab-text);
        border-color: var(--lab-border);
        background: var(--lab-bg);
    }

    .badge.tut {
        color: var(--tut-text);
        border-color: var(--tut-border);
        background: var(--tut-bg);
    }

    /* =========================
       BREAKS
       ========================= */

    .break-item {
        display: flex;
        align-items: center;
        gap: .55rem;
        padding: .2rem .25rem;
    }

    .break-line {
        flex: 1;
        height: 0;
        border-top: 1px dashed var(--border-2);
    }

    .break-chip {
        display: inline-flex;
        align-items: center;
        gap: .38rem;
        flex: none;
        font-family: var(--font-body);
        font-size: .6rem;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: .24rem .58rem;
        border-radius: 999px;
        white-space: nowrap;
    }

    .break-chip i {
        font-size: .62rem;
        color: var(--muted-2);
    }

    /* =========================
       EMPTY STATE
       ========================= */

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .3rem;
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--muted);
    }

    .empty-state i {
        font-size: 1.5rem;
        margin-bottom: .35rem;
        color: var(--muted-2);
    }

    .empty-state p {
        font-family: var(--font-display);
        font-size: .9rem;
        font-weight: 600;
        color: var(--text-2);
    }

    .empty-state span {
        font-size: .74rem;
    }

    .empty-state.small {
        padding: 1.2rem 1rem;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 9, 12, .78);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s ease;
        padding: 1rem;
    }

    .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
    }

    .modal {
        width: 100%;
        max-width: 410px;
        background: var(--surface);
        border: 1px solid var(--border-2);
        border-radius: 20px;
        padding: 1.5rem 1.3rem 1.3rem;
        transform: translateY(16px) scale(.97);
        transition: transform .38s cubic-bezier(.22, 1, .36, 1);
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
    }

    .modal-backdrop.open .modal {
        transform: translateY(0) scale(1);
    }

    .modal-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1rem;
        color: var(--accent-text);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        margin-bottom: .95rem;
    }

    .modal h2 {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -.02em;
        color: var(--text);
        margin-bottom: .35rem;
    }

    .modal > p {
        font-family: var(--font-body);
        font-size: .82rem;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 1.2rem;
    }

    .batch-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: .5rem;
        margin-bottom: 1.1rem;
    }

    .batch-btn {
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: .01em;
        color: var(--text-2);
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        padding: .85rem .5rem;
        border-radius: 12px;
        cursor: pointer;
        transition:
            color .18s ease,
            background .18s ease,
            border-color .18s ease,
            transform .18s ease;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .28rem;
    }

    .batch-btn .b-code {
        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1;
    }

    .batch-btn .b-hint {
        font-family: var(--font-body);
        font-size: .6rem;
        font-weight: 500;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .batch-btn:active {
        transform: scale(.97);
    }

    .batch-btn.selected {
        color: var(--accent-text);
        background: var(--accent-soft);
        border-color: var(--accent-border);
    }

    .batch-btn.selected .b-code {
        color: var(--accent-text);
    }

    .batch-btn.selected .b-hint {
        color: var(--accent);
    }

    @media (hover: hover) {
        .batch-btn:not(.selected):hover {
            background: var(--surface-3);
            border-color: var(--border-3);
        }
    }

    .modal-note {
        display: flex;
        align-items: flex-start;
        gap: .45rem;
        font-family: var(--font-body);
        font-size: .7rem;
        color: var(--muted);
        line-height: 1.45;
        padding: .65rem .75rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 1rem;
    }

    .modal-note i {
        color: var(--muted-2);
        font-size: .74rem;
        margin-top: 2px;
        flex: none;
    }

    .modal-actions {
        display: flex;
        gap: .5rem;
    }

    .btn {
        flex: 1;
        font-family: var(--font-body);
        font-size: .82rem;
        font-weight: 600;
        letter-spacing: .01em;
        padding: .72rem 1rem;
        border-radius: 11px;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
            background .18s ease,
            border-color .18s ease,
            color .18s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
        transform: scale(.98);
    }

    .btn-primary {
        background: var(--accent-soft);
        color: var(--accent-text);
        border-color: var(--accent-border);
    }

    .btn-primary:disabled {
        opacity: .4;
        cursor: not-allowed;
    }

    .btn-ghost {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
    }

    @media (hover: hover) {
        .btn-primary:not(:disabled):hover {
            background: var(--surface-3);
            border-color: var(--border-3);
        }

        .btn-ghost:hover {
            color: var(--text-2);
            border-color: var(--border-2);
        }
    }

    /* =========================
       REVEAL
       ========================= */

/* =====================================================
   HELPERS
   ===================================================== */

const toMin = t => {

    const [h, m] = t
        .split(":")
        .map(Number);

    return h * 60 + m;

};


const pad = n =>
    String(n).padStart(2, "0");


const nowSeconds = () => {

    const d = new Date();

    return (
        d.getHours() * 3600 +
        d.getMinutes() * 60 +
        d.getSeconds()
    );

};


function fmtDuration(mins) {

    const h = Math.floor(mins / 60);
    const m = mins % 60;

    if (h && m)
        return `${h}h ${m}m`;

    if (h)
        return `${h}h`;

    return `${m}m`;

}


/* =====================================================
   BATCH RESOLUTION
   ===================================================== */

function resolveEntryForBatch(entry, batch) {

    if (!batch)
        return entry;

    let result = {
        ...entry
    };


    /* Resolve room */

    if (
        entry.batchRooms &&
        entry.batchRooms[batch]
    ) {

        result.room =
            entry.batchRooms[batch];

    }


    /*
       Theory classes are common
       to everyone.
    */

    if (
        entry.type !== "Lab" &&
        entry.type !== "Tutorial"
    ) {

        return result;

    }


    const subj = entry.subject;


    /*
       Handle subjects such as:

       Programming (B1,B3)
       /
       Robotics (B2)
    */

    if (subj.includes("/")) {

        const parts = subj
            .split("/")
            .map(s => s.trim());


        for (const part of parts) {

            const m =
                part.match(/\(([^)]+)\)/);

            if (!m)
                continue;


            const batches =
                m[1]
                    .split(",")
                    .map(x => x.trim());


            if (batches.includes(batch)) {

                result.subject =
                    part
                        .replace(
                            /\s*\([^)]*\)\s*/g,
                            " "
                        )
                        .trim();

                return result;

            }

        }

        return null;

    }


    /*
       Handle subjects such as:

       Calculus Tutorial (B1)
    */

    const m =
        subj.match(/\(([^)]+)\)\s*$/);


    if (m) {

        const batches =
            m[1]
                .split(",")
                .map(x => x.trim());


        if (!batches.includes(batch))
            return null;


        result.subject =
            subj
                .replace(
                    /\s*\([^)]*\)\s*$/,
                    ""
                )
                .trim();

    }


    return result;

}

    const out = {};

    for (
        const day of Object.keys(MASTER_SCHEDULE)

        out[day] =
            MASTER_SCHEDULE[day]
                .map(entry =>
                    resolveEntryForBatch(
                        entry,
                        batch
                    )
                )
                .filter(Boolean);

    }

    return out;

}

/* =====================================================
   SCROLL REVEAL
   ===================================================== */

const revealObserver =
    new IntersectionObserver(

        entries => {

            entries.forEach(entry => {

                if (
                    entry.isIntersecting
                ) {

                    entry.target.classList.add(
                        "in"
                    );

                    revealObserver.unobserve(
                        entry.target
                    );

                }

            });

        },

        {
            threshold: 0.06,
            rootMargin:
                "0px 0px -6% 0px"
        }

    );


function observeReveals() {

    document
        .querySelectorAll(
            ".reveal:not(.in)"
        )
        .forEach(el =>
            revealObserver.observe(el)
        );

}


/* =====================================================
   TIMELINE
   ===================================================== */

function buildTimeline(items) {

    const sorted =
        items
            .map((it, i) => ({
                ...it,
                _i: i
            }))
            .sort(
                (a, b) =>
                    (
                        toMin(a.start) -
                        toMin(b.start)
                    ) ||
                    (
                        toMin(a.end) -
                        toMin(b.end)
                    )
            );


    const out = [];

    let cursor = null;


    for (const it of sorted) {

        const s =
            toMin(it.start);

        const e =
            toMin(it.end);


        if (
            cursor !== null &&
            s > cursor
        ) {

            out.push({

                kind: "break",

                startMin: cursor,

                endMin: s,

                minutes: s - cursor

            });

        }


        out.push({

            kind: "class",

            ...it

        });


        cursor =
            cursor === null
                ? e
                : Math.max(
                    cursor,
                    e
                );

    }


    return out;

}


/* =====================================================
   BREAK LABEL
   ===================================================== */

function breakMeta(
    startMin,
    minutes
) {

    const isLunchWindow =
        startMin >=
            11 * 60 + 30 &&
        startMin <
            14 * 60 + 30;


    if (
        isLunchWindow &&
        minutes >= 30
    ) {

        return {
            icon: "fa-utensils",
            label: "Lunch"
        };

    }


    if (minutes >= 90) {

        return {
            icon: "fa-mug-hot",
            label: "Long Break"
        };

    }


    return {
        icon: "fa-mug-hot",
        label: "Break"
    };

}

/* =====================================================
   SCHEDULE LIST
   ===================================================== */

function renderSchedule(
    animate = true
) {

    const now = new Date();

    const isToday =
        selectedDay ===
        DAYS[now.getDay()];


    const nowMin =
        now.getHours() * 60 +
        now.getMinutes();


    const items =
        activeSchedule[selectedDay] || [];


    dayCountEl.textContent =
        items.length
            ? `${items.length} session${
                items.length > 1
                    ? "s"
                    : ""
            }`
            : "";


    if (!items.length) {

        scheduleListEl.innerHTML = `

            <div class="empty-state reveal">

                <i class="fa-regular fa-calendar"></i>

                <p>
                    No classes scheduled
                </p>

                <span>
                    Enjoy your day off
                </span>

            </div>

        `;


        if (animate)
            observeReveals();

        else
            scheduleListEl
                .querySelectorAll(".reveal")
                .forEach(el =>
                    el.classList.add("in")
                );

        return;

    }


    const timeline =
        buildTimeline(items);


    let html = "";


    timeline.forEach(
        (entry, idx) => {

            const delay =
                Math.min(idx, 12) * 40;


            /* =========================
               BREAK
               ========================= */

            if (
                entry.kind === "break"
            ) {

                const meta =
                    breakMeta(
                        entry.startMin,
                        entry.minutes
                    );


                html += `

                    <div
                        class="break-item reveal"
                        style="transition-delay:${delay}ms"
                    >

                        <span class="break-line"></span>

                        <span class="break-chip">

                            <i
                                class="fa-solid ${meta.icon}"
                            ></i>

                            ${meta.label}
                            ·
                            ${fmtDuration(
                                entry.minutes
                            )}

                        </span>

                        <span class="break-line"></span>

                    </div>

                `;

                return;

            }


            /* =========================
               CLASS
               ========================= */

            const t =
                TYPE_META[entry.type] ||
                TYPE_META.Theory;


            let state = "";


            if (isToday) {

                const s =
                    toMin(entry.start);

                const e =
                    toMin(entry.end);


                if (nowMin >= e) {

                    state = "past";

                }
                else if (
                    nowMin >= s
                ) {

                    state = "now";

                }

            }


            html += `

                <article
                    class="schedule-item reveal ${state}"
                    style="transition-delay:${delay}ms"
                >

                    <div class="time-rail">

                        <span class="t-start">
                            ${entry.start}
                        </span>

                        <span class="t-line"></span>

                        <span class="t-end">
                            ${entry.end}
                        </span>

                    </div>


                    <div class="info-col">

                        <div class="info-top">

                            <h3 class="info-title">
                                ${entry.subject}
                            </h3>

                            ${
                                state === "now"
                                    ? `
                                        <span class="now-pill">
                                            <span class="pulse"></span>
                                            Now
                                        </span>
                                      `
                                    : ""
                            }

                        </div>


                        <div class="info-meta">

                            <span
                                class="badge ${t.cls}"
                            >

                                <i
                                    class="fa-solid ${t.icon}"
                                ></i>

                                ${entry.type}

                            </span>


                            <span
                                class="meta meta-room"
                            >

                                <i
                                    class="fa-solid fa-door-open"
                                ></i>

                                ${entry.room || "—"}

                            </span>


                            <span class="meta">

                                <i
                                    class="fa-solid fa-user-tie"
                                ></i>

                                ${entry.teacher || "—"}

                            </span>

                        </div>

                    </div>

                </article>

            `;

        }
    );


    scheduleListEl.innerHTML =
        html;


    if (animate)
        observeReveals();

    else
        scheduleListEl
            .querySelectorAll(".reveal")
            .forEach(el =>
                el.classList.add("in")
            );

}


/* =====================================================
   UPCOMING / ONGOING
   ===================================================== */

function getUpcoming() {

    const now =
        new Date();


    const nowSec =
        nowSeconds();


    const nowMin =
        nowSec / 60;


    const todayName =
        DAYS[now.getDay()];


    const todayItems =
        (
            activeSchedule[todayName] ||
            []
        )
        .slice()
        .sort(
            (a, b) =>
                toMin(a.start) -
                toMin(b.start)
        );


    /* =========================
       ONGOING
       ========================= */

    const ongoing =
        todayItems
            .filter(c =>
                toMin(c.start) <= nowMin &&
                toMin(c.end) > nowMin
            )
            .sort(
                (a, b) =>
                    toMin(b.start) -
                    toMin(a.start)
            );


    if (ongoing.length) {

        const c =
            ongoing[0];


        return {

            cls: c,

            ongoing: true,

            secondsLeft:
                toMin(c.end) * 60 -
                nowSec,

            dayLabel: "Today"

        };

    }


    /* =========================
       NEXT TODAY
       ========================= */

    const soon =
        todayItems.find(
            c =>
                toMin(c.start) >
                nowMin
        );


    if (soon) {

        return {

            cls: soon,

            ongoing: false,

            secondsLeft:
                toMin(soon.start) * 60 -
                nowSec,

            dayLabel: "Today"

        };

    }


    /* =========================
       NEXT DAYS
       ========================= */

    for (
        let i = 1;
        i <= 7;
        i++
    ) {

        const dayName =
            DAYS[
                (now.getDay() + i) %
                7
            ];


        const list =
            activeSchedule[dayName];


        if (
            list &&
            list.length
        ) {

            const first =
                [...list]
                    .sort(
                        (a, b) =>
                            toMin(a.start) -
                            toMin(b.start)
                    )[0];


            return {

                cls: first,

                ongoing: false,

                secondsLeft:
                    toMin(first.start) *
                        60 -
                    nowSec +
                    i * 86400,

                dayLabel:
                    i === 1
                        ? "Tomorrow"
                        : dayName

            };

        }

    }


    return null;

}


let lastCardKey =
    "__init__";


/* =====================================================
   UPCOMING CARD RENDER
   ===================================================== */

function renderUpcoming() {

    const data =
        getUpcoming();


    if (!data) {

        if (
            lastCardKey === "none"
        ) {
            return;
        }


        lastCardKey = "none";


        upcomingCardEl.className =
            "upcoming-card reveal in";


        upcomingCardEl.innerHTML = `

            <div class="empty-state small">

                <i
                    class="fa-regular fa-calendar"
                ></i>

                <p>
                    No upcoming classes
                </p>

            </div>

        `;


        return;

    }


    const {
        cls,
        ongoing,
        secondsLeft,
        dayLabel
    } = data;


    const t =
        TYPE_META[cls.type] ||
        TYPE_META.Theory;


    const secs =
        Math.max(
            0,
            secondsLeft
        );


    const h =
        Math.floor(
            secs / 3600
        );


    const m =
        Math.floor(
            (secs % 3600) / 60
        );


    const s =
        Math.floor(
            secs % 60
        );


    const timeStr =
        h > 0
            ? `${pad(h)}:${pad(m)}:${pad(s)}`
            : `${pad(m)}:${pad(s)}`;


    /* =========================
       PROGRESS
       ========================= */

    let progress = 0;


    if (ongoing) {

        const s0 =
            toMin(cls.start) *
            60;


        const e0 =
            toMin(cls.end) *
            60;


        const ns =
            nowSeconds();


        progress =
            Math.min(
                100,
                Math.max(
                    0,
                    (
                        (ns - s0) /
                        (e0 - s0)
                    ) * 100
                )
            );

    }


    const key =
        `${cls.subject}|${cls.start}|${cls.end}|${ongoing}|${dayLabel}|${cls.room}`;


    if (
        key === lastCardKey
    ) {

        const cd =
            document.getElementById(
                "countdown"
            );


        if (cd)
            cd.textContent =
                timeStr;


        const bar =
            document.getElementById(
                "progress-bar"
            );


        if (bar)
            bar.style.width =
                progress + "%";


        return;

    }


    lastCardKey = key;


    upcomingCardEl.className =
        `upcoming-card reveal in${
            ongoing
                ? " ongoing"
                : ""
        }`;


    upcomingCardEl.innerHTML = `

        <div class="upcoming-label">

            ${
                ongoing

                    ? `
                        <span class="pulse"></span>
                        Ongoing · ends in
                      `

                    : `
                        <i
                            class="fa-regular fa-hourglass-half"
                        ></i>

                        Next class in

                        ${
                            dayLabel !== "Today"
                                ? ` · ${dayLabel}`
                                : ""
                        }
                      `
            }

        </div>


        <div
            class="countdown"
            id="countdown"
        >
            ${timeStr}
        </div>


        <div class="class-title">
            ${cls.subject}
        </div>


        <div class="class-meta">

            <div class="meta-item">

                <i
                    class="fa-regular fa-clock"
                ></i>

                <span>
                    ${cls.start} – ${cls.end}
                </span>

            </div>


            <div
                class="meta-item meta-room"
            >

                <i
                    class="fa-solid fa-door-open"
                ></i>

                <span>
                    Room ${cls.room || "—"}
                </span>

            </div>


            <div class="meta-item">

                <i
                    class="fa-solid fa-user-tie"
                ></i>

                <span>
                    ${cls.teacher || "—"}
                </span>

            </div>


            <div class="meta-item">

                <i
                    class="fa-solid ${t.icon}"
                ></i>

                <span>
                    ${cls.type}${
                        dayLabel !== "Today"
                            ? " · " + dayLabel
                            : ""
                    }
                </span>

            </div>

        </div>


        ${
            ongoing

                ? `
                    <div class="progress">

                        <i
                            id="progress-bar"
                            style="width:${progress}%"
                        ></i>

                    </div>
                  `

                : ""
        }

    `;

}


/* =====================================================
   BATCH MODAL
   ===================================================== */

const modalEl =
    document.getElementById(
        "batchModal"
    );


const batchGridEl =
    document.getElementById(
        "batchGrid"
    );


const confirmBtn =
    document.getElementById(
        "confirmBtn"
    );


const cancelBtn =
    document.getElementById(
        "cancelBtn"
    );


const batchChipEl =
    document.getElementById(
        "batchChip"
    );


const batchChipTextEl =
    document.getElementById(
        "batchChipText"
    );


let pendingBatch = null;

let isInitialSetup = true;


/* =====================================================
   OPEN MODAL
   ===================================================== */

function openBatchModal(
    isInitial
) {

    isInitialSetup =
        !!isInitial;


    pendingBatch =
        isInitial
            ? null
            : currentBatch;


    updateBatchSelectionUI();


    cancelBtn.hidden =
        isInitial;


    confirmBtn.textContent =
        isInitial
            ? "Continue"
            : "Save";


    modalEl.classList.add(
        "open"
    );


    document.body.style.overflow =
        "hidden";


    setTimeout(() => {

        const first =
            batchGridEl.querySelector(
                ".batch-btn"
            );


        if (first) {

            first.focus({
                preventScroll: true
            });

        }

    }, 150);

}


/* =====================================================
   CLOSE MODAL
   ===================================================== */

function closeBatchModal() {

    modalEl.classList.remove(
        "open"
    );


    document.body.style.overflow =
        "";

}


/* =====================================================
   UPDATE BATCH UI
   ===================================================== */

function updateBatchSelectionUI() {

    batchGridEl
        .querySelectorAll(
            ".batch-btn"
        )
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.batch ===
                pendingBatch
            );

        });


    confirmBtn.disabled =
        !pendingBatch;

}


/* =====================================================
   APPLY BATCH
   ===================================================== */

function applyBatch(batch) {

    currentBatch =
        batch;


    activeSchedule =
        getScheduleForBatch(
            batch
        );


    batchChipTextEl.textContent =
        batch;


    lastCardKey =
        "__init__";


    renderSchedule(false);

    renderUpcoming();

}


/* =====================================================
   BATCH BUTTONS
   ===================================================== */

batchGridEl
    .querySelectorAll(
        ".batch-btn"
    )
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => {

                pendingBatch =
                    btn.dataset.batch;


                updateBatchSelectionUI();

            }
        );

    });


/* =====================================================
   CONFIRM
   ===================================================== */

confirmBtn.addEventListener(
    "click",
    () => {

        if (!pendingBatch)
            return;


        try {

            localStorage.setItem(
                BATCH_KEY,
                pendingBatch
            );

        } catch (e) {}


        applyBatch(
            pendingBatch
        );


        closeBatchModal();

    }
);


/* =====================================================
   CANCEL
   ===================================================== */

cancelBtn.addEventListener(
    "click",
    () => {

        if (isInitialSetup)
            return;


        closeBatchModal();

    }
);


/* =====================================================
   BACKDROP CLICK
   ===================================================== */

modalEl.addEventListener(
    "click",
    e => {

        if (
            e.target === modalEl &&
            !isInitialSetup
        ) {

            closeBatchModal();

        }

    }
);


/* =====================================================
   ESCAPE KEY
   ===================================================== */

document.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "Escape" &&
            modalEl.classList.contains(
                "open"
            ) &&
            !isInitialSetup
        ) {

            closeBatchModal();

        }

    }
);


/* =====================================================
   HEADER BATCH BUTTON
   ===================================================== */

batchChipEl.addEventListener(
    "click",
    () =>
        openBatchModal(false)
);


/* =====================================================
   BOOT
   ===================================================== */

function boot() {

    let savedBatch = null;


    try {

        savedBatch =
            localStorage.getItem(
                BATCH_KEY
            );

    } catch (e) {}


    if (
        !VALID_BATCHES.includes(
            savedBatch
        )
    ) {

        savedBatch = null;

    }


    renderDaySelector();


    /* =========================
       SAVED BATCH
       ========================= */

    if (savedBatch) {

        currentBatch =
            savedBatch;


        activeSchedule =
            getScheduleForBatch(
                savedBatch
            );


        batchChipTextEl.textContent =
            savedBatch;


        renderSchedule(true);

        renderUpcoming();

        observeReveals();

    }


    /* =========================
       FIRST VISIT
       ========================= */

    else {

        currentBatch =
            null;


        activeSchedule =
            MASTER_SCHEDULE;


        batchChipTextEl.textContent =
            "—";


        renderSchedule(true);

        renderUpcoming();

        observeReveals();

        openBatchModal(true);

    }

}


boot();


/* =====================================================
   LIVE COUNTDOWN
   ===================================================== */

setInterval(
    () => {

        renderUpcoming();

    },
    1000
);


/* =====================================================
   REFRESH CURRENT CLASS STATE
   ===================================================== */

setInterval(
    () => {

        renderSchedule(false);

    },
    30000
);


/* =====================================================
   MIDNIGHT / DAY CHANGE
   ===================================================== */

let lastDayName =
    DAYS[new Date().getDay()];


setInterval(
    () => {

        const todayName =
            DAYS[new Date().getDay()];


        if (
            todayName !==
            lastDayName
        ) {

            lastDayName =
                todayName;


            if (
                !WEEK.includes(
                    selectedDay
                )
            ) {

                selectedDay =
                    "Monday";

            }


            renderDaySelector();

            renderSchedule(false);


            lastCardKey =
                "__init__";


            renderUpcoming();

        }

    },
    60000
);

</script>

</body>
</html>
